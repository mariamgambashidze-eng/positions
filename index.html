<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="container2">
            <div class="card-container">
                <div class="photo-container">
                    <div class="svgs">
                        <img class="svg1" src="./photos/share_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="share svg">
                        <img class="svg2" src="./photos/favorite_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="heart svg">
                    </div>
                    <img class="apple" src="./photos/apples-9390176_640-removebg-preview.png" alt="apple image">
                </div>
                <div class="little-photos">
                    <div class="apple1"><img src="./photos/green-apple_919652-11586.png" alt="full green apple image"></div>
                    <div class="apple1"><img src="./photos/sliced-green-apple_93675-45451.png" alt="sliced green apple"></div>
                    <div class="apple1"><img src="./photos/istockphoto-818929628-170667a.png" alt="green apple turned over"></div>
                    <div class="apple1"><img src="./photos/istockphoto-1320819542-1024x1024.png" alt="green apple from above"></div>
                </div>
            </div>
            <div class="text-container">
                <h1>Delicious Apples</h1>
                <p>COD: 45999</p>

                <p class="p">R$ <span>7.93</span></p>
                <p class="select">SELECT A COLOR</p>
                <div class="apple-colors">
                    <div class="apple2 green"><img src="./photos/green-apple_919652-11586.png" alt="full green apple image"></div>
                    <div class="apple2 yellow"><img src="./photos/green-apple_919652-11586.png" alt="full green apple image"></div>
                    <div class="apple2 orange"><img src="./photos/green-apple_919652-11586.png" alt="full green apple image"></div>
                    <div class="apple2 red"><img src="./photos/green-apple_919652-11586.png" alt="full green apple image"></div>
                    
                </div>

                <p class="benefits">BENEFITS</p>
                <ul>
                    <li>Apples are nutricious</li>
                    <li>Apples may be good for weight loss</li>
                    <li>Apples may be good for bone health</li>
                    <li>They're linked to a lowest risk of diabetes</li>
                </ul>
                <button class="button" type="submit">ADD TO CART</button>

            </div>
        </div>
    </div>

</body>
</html>
